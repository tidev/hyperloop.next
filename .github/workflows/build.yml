name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run build script
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperloop-module
          path: dist/hyperloop-*.zip
